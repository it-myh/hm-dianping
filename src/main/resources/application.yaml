# 配置服务器端口
server:
  port: 8081
spring:
  # 配置应用名称
  application:
    name: hmdp
  # 配置数据库连接
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  # 配置Redis
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
      # 配置Redis连接池
      lettuce:
        pool:
          max-active: 10 # 最大连接数
          max-idle: 10 # 最大空闲连接数
          min-idle: 1 # 最小空闲连接数
          time-between-eviction-runs: 10s # 每10秒执行一次清理操作
  # 配置Jackson
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
# 配置Mybatis-Plus
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
  configuration:
    # 开启SQL日志，控制台输出（开发用，生产注释掉！）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
# 配置日志级别
logging:
  level:
    com.hmdp: info
jwt:
  secret: bWFveW9uZ2hhb3NoaW5pZGViYWJhc2hpbmlkZWRpZQ== # JWT密钥
  expire: 7200000 # 2小时，单位毫秒